[workspace]
members = [
    "crates/kgi",
    "crates/kgi-api-core",
    "crates/kgi-api-ingress",
    "crates/kgi-api-model",
    "crates/kgi-core",
    "crates/kgi-model",
    "crates/kgi-node",
    "crates/kgi-processing",
    "crates/kgi-storage",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["kaspa-live developers"]
license = "ISC"
repository = "https://github.com/kaspa-live/kaspa-graph-inspector-rs"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
