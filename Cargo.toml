[workspace]
members = [
    "crates/kgi",
    "crates/kgi-api-core",
    "crates/kgi-api-ingress",
    "crates/kgi-api-model",
    "crates/kgi-core",
    "crates/kgi-model",
    "crates/kgi-node",
    "crates/kgi-processing",
    "crates/kgi-storage",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["kaspa-live developers"]
license = "ISC"
repository = "https://github.com/kaspa-live/kaspa-graph-inspector-rs"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.88"
clap = { version = "4.5.35", features = ["derive", "string", "cargo"] }
ctrlc = { version = "3.4.1", features = ["termination"] }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.1.0" }
kaspa-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.1.0" }
kaspa-grpc-client = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.1.0" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.1.0" }
kaspa-math = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.1.0" }
kaspa-notify = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.1.0" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.1.0" }
log = "0.4.20"
rand = { version = "0.8.5", features = ["small_rng"] }
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "2.0.18"
tokio = { version = "1.42.1", features = ["macros", "rt", "sync", "time"] }
toml = "0.8.8"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
